name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Only unit + integration tests are instrumented: the vm tests need real btrfs + S3 and run
      # separately (uninstrumented) in the vm job below, so their coverage isn't reflected in
      # this number.
      #
      # The 70% floor is a regression guard, not a target: it's set a couple points below what
      # this scope currently measures. Raise it as coverage improves; don't lower it to make a
      # failing PR pass.
      - name: Test with coverage
        run: cargo llvm-cov --lib --bins --test integration --fail-under-lines 70

  vm:
    runs-on: ubuntu-latest
    env:
      # CI=true is already set by GitHub Actions for every job; the vm test binary keys off it
      # to fail loudly instead of silently skipping when the env vars below are wrong.
      BCB_BTRFS_MOUNT: /mnt/bcb-test
      BCB_S3_ENDPOINT: http://localhost:8333
      BCB_S3_BUCKET: bcb-test
      AWS_ACCESS_KEY_ID: s3testcreds
      AWS_SECRET_ACCESS_KEY: s3testcreds
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up btrfs loopback mount and S3-compatible test server
        run: sudo bash scripts/setup-vm.sh

      - name: Build bcb binary (dev profile, keeps BCB_TEST_PAUSE_* hooks compiled in)
        run: cargo build --bin bcb

      - name: Build vm test binary
        run: cargo test --test vm --no-run

      - name: Run vm tests
        run: |
          set -euo pipefail
          bin=$(ls -t target/debug/deps/vm-* | grep -v '\.d$' | head -1)
          sudo env \
            "BCB_BTRFS_MOUNT=$BCB_BTRFS_MOUNT" \
            "BCB_S3_ENDPOINT=$BCB_S3_ENDPOINT" \
            "BCB_S3_BUCKET=$BCB_S3_BUCKET" \
            "BCB_BIN_PATH=$PWD/target/debug/bcb" \
            "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" \
            "CI=$CI" \
            "$bin" --nocapture
