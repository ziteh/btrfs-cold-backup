name: Btrfs loopback probe

on:
  push:
    branches: [ci/btrfs-loopback-probe]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BCB_BTRFS_MOUNT: /mnt/bcb-test
  BCB_S3_ENDPOINT: http://localhost:9000
  BCB_S3_BUCKET: bcb-test
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up btrfs loopback mount and MinIO
        run: sudo bash scripts/setup-vm.sh

      - name: Build bcb binary (dev profile, keeps BCB_TEST_PAUSE_* hooks compiled in)
        run: cargo build --bin bcb

      - name: Build e2e/vm test binaries
        run: cargo test --test e2e --test vm --no-run

      - name: Run vm tests
        run: |
          set -euo pipefail
          bin=$(ls -t target/debug/deps/vm-* | grep -v '\.d$' | head -1)
          sudo env \
            "BCB_BTRFS_MOUNT=$BCB_BTRFS_MOUNT" \
            "BCB_S3_ENDPOINT=$BCB_S3_ENDPOINT" \
            "BCB_S3_BUCKET=$BCB_S3_BUCKET" \
            "BCB_BIN_PATH=$PWD/target/debug/bcb" \
            "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" \
            "$bin" --nocapture

      - name: Run e2e tests
        run: |
          set -euo pipefail
          bin=$(ls -t target/debug/deps/e2e-* | grep -v '\.d$' | head -1)
          sudo env \
            "BCB_BTRFS_MOUNT=$BCB_BTRFS_MOUNT" \
            "BCB_S3_ENDPOINT=$BCB_S3_ENDPOINT" \
            "BCB_S3_BUCKET=$BCB_S3_BUCKET" \
            "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" \
            "$bin" --nocapture
