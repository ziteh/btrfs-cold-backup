# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the bcb binary (dev)
    cmds:
      - cargo build --bin bcb

  release:
    desc: Build the bcb binary (release)
    cmds:
      - cargo build --release --bin bcb

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt
      - shfmt -w scripts

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --check
      - shfmt -d scripts

  lint:
    desc: Run clippy with warnings denied, and shellcheck
    cmds:
      - cargo clippy --all-targets -- -D warnings
      - shellcheck -x -S warning scripts/*.sh

  test:
    desc: Run unit and integration tests
    cmds:
      - cargo test --lib --bins --test integration

  coverage:
    desc: Run unit and integration tests with the CI coverage floor
    cmds:
      - cargo llvm-cov --lib --bins --test integration --fail-under-lines 79

  vm:
    desc: Run the VM tests in a Multipass VM (pass --fresh to recreate the VM)
    cmds:
      - bash scripts/run-vm-tests.sh {{.CLI_ARGS}}

  drill:
    desc: Run the power-loss drill (run after the VM tests, before a release)
    cmds:
      - bash scripts/power-loss-drill.sh

  aws-drill:
    desc: Run the real AWS drill; re-run until it exits 0 (see docs/aws-drill.md)
    cmds:
      - bash scripts/aws-drill.sh {{.CLI_ARGS}}

  aws-drill:setup:
    desc: One-time AWS setup for the drill (pass the bucket name after --)
    cmds:
      - bash scripts/aws-drill-setup.sh {{.CLI_ARGS}}

  ci:
    desc: Run the same checks as the CI test job
    cmds:
      - task: fmt:check
      - task: lint
      - task: coverage

  spell:
    desc: Run the spell checker
    cmds:
      - pnpx cspell .

  git-hooks:
    desc: Install the git hooks managed by lefthook
    cmds:
      - lefthook install
